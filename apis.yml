aid: charles-co
name: Charles Co
description: >-
  Charles (charlesAI, hello-charles.com) is a Berlin-based conversational
  commerce and CRM platform that lets brands sell, market, and support customers
  over WhatsApp, Instagram, Facebook Messenger, and Webchat. Founded in 2019, the
  platform connects chat-app APIs (WhatsApp Business, Messenger) with e-commerce
  and CRM systems such as Shopify, Salesforce, SAP, and HubSpot, and layers
  AI agents over them to automate the full funnel from acquisition and conversion
  to retention while staying GDPR compliant. Charles exposes a token-authenticated
  HTTP API organized around per-tenant "universe" hosts, a public Postman
  workspace, and a (now deprecated) JavaScript/TypeScript browser SDK published to
  npm. It was surfaced as a portfolio lead of Speedinvest and enriched into the
  API Evangelist network from its public developer surface.
